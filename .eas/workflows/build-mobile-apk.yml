name: Build Kirana Android APK

on:
  push:
    branches: ['main']
    paths:
      - '.eas/TRIGGER_APK_BUILD'

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

defaults:
  image: sdk-57

jobs:
  build_android_apk:
    name: Build installable Android APK
    type: build
    environment: production
    params:
      platform: android
      profile: preview
      message: Kirana Software Mobile 1.0.6 AI Bill + Native Voice APK
