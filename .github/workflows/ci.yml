name: Kirana Software CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/settings-v2.js
          node --check static/features-v1.js
          node --check plugins/withNativeKiranaActivityV4.js
          node --check plugins/withNativeVoiceBridgeV5.js
          node --check mobile/app.config.js
      - name: Validate Expo Android prebuild
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx expo config --type public >/tmp/expo-config.json
          npx expo prebuild --no-install --platform android --clean
      - name: Compile Android debug APK locally
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Check Python syntax
        run: python -m py_compile backend/app.py backend/settings_ext.py backend/items_ext.py backend/features_ext.py backend/smart_tools_runtime_fix_ext.py backend/quick_write_voice_accuracy_ext.py backend/quick_write_voice_runtime_fix_ext.py run.py
      - name: Install test dependencies
        run: pip install -r requirements.txt pytest httpx
      - name: Run tests
        env:
          KIRANA_DB_PATH: /tmp/kirana-ci.db
        run: pytest -q
