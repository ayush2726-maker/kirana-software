name: Kirana Software CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/settings-v2.js
          node --check static/features-v1.js
      - name: Check Python syntax
        run: python -m py_compile backend/app.py backend/settings_ext.py backend/items_ext.py backend/features_ext.py run.py
      - name: Install test dependencies
        run: pip install -r requirements.txt pytest httpx
      - name: Run tests
        env:
          KIRANA_DB_PATH: /tmp/kirana-ci.db
        run: pytest -q
