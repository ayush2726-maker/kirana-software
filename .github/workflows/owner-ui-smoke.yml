name: Owner UI Smoke

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "static/owner-stable.*"
      - "static/owner-transactions.*"
      - "static/owner-credit-*"
      - "static/owner-linked-payments.js"
      - "static/owner-customer-catalog.*"
      - "static/owner-customer-share.*"
      - "static/owner-customer-otp.*"
      - "static/customer-order.js"
      - "static/customer-self-register.js"
      - "static/owner-bulk-items.*"
      - "static/owner-bulk-errors.js"
      - "static/owner-back-navigation.js"
      - "plugins/withNativeKiranaActivityV3.js"
      - "run.py"
      - "tests/owner_ui_smoke.py"
      - "tests/owner_boot_recovery_smoke.py"
      - "tests/bulk_items_smoke.py"
      - "tests/credit_link_smoke.py"
      - "tests/customer_catalog_manager_smoke.py"
      - "tests/customer_login_share_smoke.py"
      - "tests/customer_multi_shop_smoke.py"
      - ".github/workflows/owner-ui-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  owner-ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KIRANA_DB_PATH: ${{ runner.temp }}/kirana-owner-ui.db
      OWNER_UI_ARTIFACT_DIR: test-artifacts
    steps:
      - name: Mark owner UI test pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'owner-ui-smoke',
              description: 'Testing startup recovery, customer login, OTP and billing'
            });

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install server and browser test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt requests playwright
          python -m playwright install --with-deps chromium

      - name: Check owner, customer and native JavaScript syntax
        run: |
          node --check static/owner-stable.js
          node --check static/owner-transactions.js
          node --check static/owner-credit-defaults.js
          node --check static/owner-linked-payments.js
          node --check static/owner-customer-catalog.js
          node --check static/owner-customer-share.js
          node --check static/owner-customer-otp.js
          node --check static/customer-order.js
          node --check static/customer-self-register.js
          node --check static/owner-bulk-items.js
          node --check static/owner-bulk-errors.js
          node --check static/owner-back-navigation.js
          node --check plugins/withNativeKiranaActivityV3.js
          python -m py_compile backend/stable_owner_app_ext.py backend/owner_boot_recovery_ext.py backend/customer_catalog_manager_ext.py backend/customer_catalog_owner_ui_ext.py backend/customer_catalog_15day_fix_ext.py backend/customer_login_share_fix_ext.py backend/customer_login_race_fix_ext.py backend/customer_registration_reset_ext.py backend/bulk_items_ext.py tests/owner_ui_smoke.py tests/owner_boot_recovery_smoke.py tests/bulk_items_smoke.py tests/credit_link_smoke.py tests/customer_catalog_manager_smoke.py tests/customer_login_share_smoke.py tests/customer_multi_shop_smoke.py

      - name: Start Kirana server
        run: |
          python run.py > server.log 2>&1 &
          echo $! > server.pid
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat server.log
          exit 1

      - name: Test owner startup recovery
        run: python tests/owner_boot_recovery_smoke.py

      - name: Run mobile browser workflow
        run: python tests/owner_ui_smoke.py

      - name: Test credit defaults and linked payments
        run: python tests/credit_link_smoke.py

      - name: Test customer catalog 15-day rate rule
        run: python tests/customer_catalog_manager_smoke.py

      - name: Test customer login and WhatsApp sharing
        run: python tests/customer_login_share_smoke.py

      - name: Test same customer across separate shops
        run: python tests/customer_multi_shop_smoke.py

      - name: Test 501-item bulk save
        run: python tests/bulk_items_smoke.py

      - name: Mark owner UI test successful
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'owner-ui-smoke',
              description: 'Startup recovery, customer flows and billing passed'
            });

      - name: Mark owner UI test failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              context: 'owner-ui-smoke',
              description: 'Mobile owner/customer workflow test failed'
            });

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-ui-smoke-diagnostics
          path: |
            test-artifacts/
            server.log
          if-no-files-found: ignore
